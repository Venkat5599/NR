[package]
name = "lunar-receive"
description = "Receive contract: EVM receive addresses derived through the NEAR signer, with recovery of verified transfers"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
sha3 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
